name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the submodules we need
        run: git submodule update --init --recursive --depth 1 libs/JUCE libs/googletest libs/ARA_SDK

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libxi-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: set -o pipefail; cmake --build build --parallel 2>&1 | tee build.log

      - name: Check for warnings
        run: |
          if grep -E "src/.*warning:" build.log | grep -v "BinaryData"; then
            echo "::error::Warnings found in project code"
            exit 1
          fi

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package plugins
        if: github.event_name == 'push'
        run: |
          VST3=$(find build -name "Multiply and Replenish.vst3" -type d | head -1)
          STANDALONE="build/MultiplyAndReplenish_artefacts/Release/Standalone"
          echo "VST3=$VST3 STANDALONE=$STANDALONE"
          tar cf Multiply.and.Replenish-linux-vst3.tar -C "$(dirname "$VST3")" "$(basename "$VST3")"
          tar cf Multiply.and.Replenish-linux-standalone.tar -C "$(dirname "$STANDALONE")" "$(basename "$STANDALONE")"

      - name: Upload artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Multiply.and.Replenish-linux
          path: |
            Multiply.and.Replenish-linux-vst3.tar
            Multiply.and.Replenish-linux-standalone.tar

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the submodules we need
        shell: bash
        run: git submodule update --init --recursive --depth 1 libs/JUCE libs/googletest libs/ARA_SDK

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        shell: bash
        run: set -o pipefail; cmake --build build --config Release 2>&1 | tee build.log

      - name: Check for warnings
        shell: bash
        run: |
          if grep -iE "warning C[0-9]+" build.log | grep -v "BinaryData"; then
            echo "::error::Warnings found in project code"
            exit 1
          fi

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Package plugins
        if: github.event_name == 'push'
        shell: bash
        run: |
          VST3=$(find build -name "Multiply and Replenish.vst3" -type d | head -1)
          STANDALONE="build/MultiplyAndReplenish_artefacts/Release/Standalone"
          echo "VST3=$VST3 STANDALONE=$STANDALONE"
          tar cf Multiply.and.Replenish-windows-vst3.tar -C "$(dirname "$VST3")" "$(basename "$VST3")"
          tar cf Multiply.and.Replenish-windows-standalone.tar -C "$(dirname "$STANDALONE")" "$(basename "$STANDALONE")"

      - name: Upload artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Multiply.and.Replenish-windows
          path: |
            Multiply.and.Replenish-windows-vst3.tar
            Multiply.and.Replenish-windows-standalone.tar

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the submodules we need
        run: git submodule update --init --recursive --depth 1 libs/JUCE libs/googletest libs/ARA_SDK

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: set -o pipefail; cmake --build build --parallel 2>&1 | tee build.log

      - name: Check for warnings
        run: |
          if grep -E "src/.*warning:" build.log | grep -v "BinaryData"; then
            echo "::error::Warnings found in project code"
            exit 1
          fi

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package plugins
        if: github.event_name == 'push'
        run: |
          VST3=$(find build -name "Multiply and Replenish.vst3" -type d | head -1)
          STANDALONE=$(find build -name "Multiply and Replenish.app" -type d | head -1)
          echo "VST3=$VST3 STANDALONE=$STANDALONE"
          tar cf Multiply.and.Replenish-macos-vst3.tar -C "$(dirname "$VST3")" "$(basename "$VST3")"
          tar cf Multiply.and.Replenish-macos-standalone.tar -C "$(dirname "$STANDALONE")" "$(basename "$STANDALONE")"

      - name: Upload artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Multiply.and.Replenish-macos
          path: |
            Multiply.and.Replenish-macos-vst3.tar
            Multiply.and.Replenish-macos-standalone.tar

  release:
    if: github.event_name == 'push'
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: Multiply and Replenish v0.2.0
          files: |
            artifacts/Multiply.and.Replenish-linux/*.tar
            artifacts/Multiply.and.Replenish-windows/*.tar
            artifacts/Multiply.and.Replenish-macos/*.tar
